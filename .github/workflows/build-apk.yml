name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile the installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # FIX: Moved Java setup here so the Android SDK installer can use it
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install the required Gradle version
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install web dependencies
        run: npm ci

      - name: Compile the mobile web game
        run: npm run build -- --base=./

      - name: Compile the Android app
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Save the installable Android APK
        uses: actions/upload-artifact@v7
        with:
          name: lisiere-android-debug-\${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show download instructions
        run: |
          echo '### LISIERE for Android' >> "\$GITHUB_STEP_SUMMARY"
          echo 'The installable **debug APK** is available in this run under **Artifacts**.' >> "\$GITHUB_STEP_SUMMARY"
          echo 'Download and extract `lisiere-android-debug-${{ github.sha }}.zip`, then install `app-debug.apk` on an Android phone.' >> "\$GITHUB_STEP_SUMMARY"
